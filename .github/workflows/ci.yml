name: CI

# 无真实 VRChat 凭据的冒烟测试（解冻 PR-3）：
#   - test-registry.mjs  （注册表完整性：91 工具、顺序+定义+handler，无凭据可跑）
#   - dump-tools.mjs     （权威工具清单 = 91 行）
#   - check-doc-drift.py （文档漂移：skill 工具清单/数字残留/版本同步/死引用，has_drift=false）
#
# 刻意不接入任何真实凭据：本仓库所有自动化测试只能覆盖「无凭据也能验证」的部分，
# 涉及真实 VRChat 登录的验证仍由作者人工完成（见 DEVELOPMENT.md「测试与 CI」）。

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: node ${{ matrix.node }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Registry integrity (91 tools, no credentials)
        run: node test-registry.mjs

      - name: Dump tools and assert count = 91
        shell: bash
        run: |
          node scripts/dump-tools.mjs > "$RUNNER_TEMP/tools.txt"
          count=$(wc -l < "$RUNNER_TEMP/tools.txt")
          echo "dump-tools lines: $count"
          if [ "$count" -ne 91 ]; then
            echo "::error::expected 91 tools, got $count"
            exit 1
          fi

      - name: Doc drift check (has_drift must be false)
        shell: bash
        run: |
          if command -v python3 >/dev/null 2>&1; then PY=python3
          elif command -v python >/dev/null 2>&1; then PY=python
          else echo "::error::python not found"; exit 2; fi
          "$PY" scripts/check-doc-drift.py --json
